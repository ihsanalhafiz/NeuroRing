[connectivity]
nk=NeuroRing:5:NeuroRing_0,NeuroRing_1,NeuroRing_2,NeuroRing_3,NeuroRing_4
nk=SynapseRouter:5:SynapseRouter_0,SynapseRouter_1,SynapseRouter_2,SynapseRouter_3,SynapseRouter_4

sp=NeuroRing_0.SpikeRecorder_SynapseList:HBM[0:1]
sp=NeuroRing_1.SpikeRecorder_SynapseList:HBM[4:5]
sp=NeuroRing_2.SpikeRecorder_SynapseList:HBM[8:9]
sp=NeuroRing_3.SpikeRecorder_SynapseList:HBM[12:13]
sp=NeuroRing_4.SpikeRecorder_SynapseList:HBM[14:15]

stream_connect=NeuroRing_0.SynapseStreamRight:SynapseRouter_0.synapse_stream_right:256
stream_connect=NeuroRing_1.SynapseStreamRight:SynapseRouter_1.synapse_stream_right:256
stream_connect=NeuroRing_2.SynapseStreamRight:SynapseRouter_2.synapse_stream_right:256
stream_connect=NeuroRing_3.SynapseStreamRight:SynapseRouter_3.synapse_stream_right:256
stream_connect=NeuroRing_4.SynapseStreamRight:SynapseRouter_4.synapse_stream_right:256

stream_connect=NeuroRing_0.SynapseStreamLeft:SynapseRouter_0.synapse_stream_left:256
stream_connect=NeuroRing_1.SynapseStreamLeft:SynapseRouter_1.synapse_stream_left:256
stream_connect=NeuroRing_2.SynapseStreamLeft:SynapseRouter_2.synapse_stream_left:256
stream_connect=NeuroRing_3.SynapseStreamLeft:SynapseRouter_3.synapse_stream_left:256
stream_connect=NeuroRing_4.SynapseStreamLeft:SynapseRouter_4.synapse_stream_left:256

stream_connect=SynapseRouter_0.SpikeOutWeight:NeuroRing_0.SpikeInWeight:64
stream_connect=SynapseRouter_1.SpikeOutWeight:NeuroRing_1.SpikeInWeight:64
stream_connect=SynapseRouter_2.SpikeOutWeight:NeuroRing_2.SpikeInWeight:64
stream_connect=SynapseRouter_3.SpikeOutWeight:NeuroRing_3.SpikeInWeight:64
stream_connect=SynapseRouter_4.SpikeOutWeight:NeuroRing_4.SpikeInWeight:64

stream_connect=SynapseRouter_0.syn_forward_rt_right:SynapseRouter_1.syn_route_in_right:2048
stream_connect=SynapseRouter_1.syn_forward_rt_right:SynapseRouter_2.syn_route_in_right:2048
stream_connect=SynapseRouter_2.syn_forward_rt_right:SynapseRouter_3.syn_route_in_right:2048
stream_connect=SynapseRouter_3.syn_forward_rt_right:SynapseRouter_4.syn_route_in_right:2048
stream_connect=SynapseRouter_4.syn_forward_rt_right:SynapseRouter_0.syn_route_in_right:2048

stream_connect=SynapseRouter_0.syn_forward_rt_left:SynapseRouter_4.syn_route_in_left:2048
stream_connect=SynapseRouter_4.syn_forward_rt_left:SynapseRouter_3.syn_route_in_left:2048
stream_connect=SynapseRouter_3.syn_forward_rt_left:SynapseRouter_2.syn_route_in_left:2048
stream_connect=SynapseRouter_2.syn_forward_rt_left:SynapseRouter_1.syn_route_in_left:2048
stream_connect=SynapseRouter_1.syn_forward_rt_left:SynapseRouter_0.syn_route_in_left:2048


[vivado]
# Strong general-purpose timing closure strategy
prop=run.impl_1.strategy=Congestion_SpreadLogic_medium

#
## Drive the flow harder (routing/placement/physopt)
#prop=run.impl_1.STEPS.OPT_DESIGN.ARGS.DIRECTIVE=Explore
#prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=Explore
#prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
#prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=Explore
#prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
#
## Make sure these steps are enabled (some flows disable them)
#prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
#prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
