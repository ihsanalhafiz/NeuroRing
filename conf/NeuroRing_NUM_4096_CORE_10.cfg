[connectivity]
nk=NeuroRing:1:NeuroRing_0
nk=NeuroRing_Poisson:1:NeuroRing_Poisson_0
nk=SynapseRouter:2:SynapseRouter_0,SynapseRouter_1

sp=NeuroRing_0.SpikeRecorder_SynapseList:HBM[0]
sp=NeuroRing_Poisson_0.SpikeRecorder_SynapseList:HBM[4]

stream_connect=NeuroRing_0.SynapseStreamRight:SynapseRouter_0.synapse_stream_right:256
stream_connect=NeuroRing_Poisson_0.SynapseStreamRight:SynapseRouter_1.synapse_stream_right:256

stream_connect=NeuroRing_0.SynapseStreamLeft:SynapseRouter_0.synapse_stream_left:256
stream_connect=NeuroRing_Poisson_0.SynapseStreamLeft:SynapseRouter_1.synapse_stream_left:256

stream_connect=SynapseRouter_0.SpikeOutWeight:NeuroRing_0.SpikeInWeight:128
stream_connect=SynapseRouter_1.SpikeOutWeight:NeuroRing_Poisson_0.SpikeInWeight:128

stream_connect=SynapseRouter_0.syn_forward_rt_right:SynapseRouter_1.syn_route_in_right:4096
stream_connect=SynapseRouter_1.syn_forward_rt_right:SynapseRouter_0.syn_route_in_right:8192

stream_connect=SynapseRouter_0.syn_forward_rt_left:SynapseRouter_1.syn_route_in_left:4096
stream_connect=SynapseRouter_1.syn_forward_rt_left:SynapseRouter_0.syn_route_in_left:8192


[vivado]
# Strong general-purpose timing closure strategy
prop=run.impl_1.strategy=Performance_ExplorePostRoutePhysOpt

#
## Drive the flow harder (routing/placement/physopt)
#prop=run.impl_1.STEPS.OPT_DESIGN.ARGS.DIRECTIVE=Explore
#prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=Explore
#prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
#prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=Explore
#prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
#
## Make sure these steps are enabled (some flows disable them)
#prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
#prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
